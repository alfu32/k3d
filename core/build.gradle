[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.tommyettinger:libgdx-utils:$utilsVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "io.github.libktx:ktx-freetype:$ktxVersion"
  api "io.github.libktx:ktx-graphics:$ktxVersion"
  api "io.github.libktx:ktx-json:$ktxVersion"
  api "io.github.libktx:ktx-math:$ktxVersion"
  api "io.github.libktx:ktx-style:$ktxVersion"
  api "io.github.libktx:ktx-vis-style:$ktxVersion"
  api "io.github.libktx:ktx-vis:$ktxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesVersion"
  implementation "org.apache.groovy:groovy:4.0.21"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

tasks.register('pluginApiJar', Jar) {
  dependsOn classes
  archiveBaseName.set('k3d-plugin-api')
  from sourceSets.main.output
}

tasks.register('copyPluginApiJar', Copy) {
  dependsOn 'pluginApiJar'
  from tasks.named('pluginApiJar').flatMap { it.archiveFile }
  into "${rootProject.rootDir}/dist/plugins"
}

tasks.register('copySamplePlugins', Copy) {
  from "${rootProject.rootDir}/scripts"
  include '**/*.groovy'
  into "${rootProject.rootDir}/dist/plugins"
}

tasks.register('preparePlugins') {
  dependsOn 'copyPluginApiJar', 'copySamplePlugins'
}
