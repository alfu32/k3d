[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

java.sourceCompatibility = 17
java.targetCompatibility = 17
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(17)
}

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.tommyettinger:libgdx-utils:$utilsVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "io.github.libktx:ktx-freetype:$ktxVersion"
  api "io.github.libktx:ktx-graphics:$ktxVersion"
  api "io.github.libktx:ktx-json:$ktxVersion"
  api "io.github.libktx:ktx-math:$ktxVersion"
  api "io.github.libktx:ktx-style:$ktxVersion"
  api "io.github.libktx:ktx-vis-style:$ktxVersion"
  api "io.github.libktx:ktx-vis:$ktxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinxCoroutinesVersion"
  implementation "org.apache.groovy:groovy:4.0.21"
  implementation "org.locationtech.jts:jts-core:1.19.0"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

tasks.register('pluginApiJar', Jar) {
  dependsOn classes
  archiveBaseName.set('octodraw-plugin-api')
  from sourceSets.main.output
}

def resolveGitValue = { List<String> args ->
  try {
    def process = new ProcessBuilder(args)
      .directory(rootProject.rootDir)
      .redirectErrorStream(true)
      .start()
    def output = process.inputStream.text.trim()
    def code = process.waitFor()
    return code == 0 ? output : ""
  } catch (Exception ignored) {
    return ""
  }
}

tasks.register('generateK3DVersion') {
  def outFile = file("src/main/kotlin/com/github/alfu32/sketch/K3DVersion.kt")
  outputs.file(outFile)
  outputs.upToDateWhen { false }
  doLast {
    def commit = resolveGitValue(["git", "rev-parse", "HEAD"])
    def branch = resolveGitValue(["git", "branch", "--show-current"])
    def tag = resolveGitValue(["git", "describe", "--tags", "--abbrev=0"])
    def buildDate = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("UTC"))
    def buildVersion = (project.findProperty("releaseNumber") ?: project.version).toString()
    outFile.parentFile.mkdirs()
    outFile.text = """package com.github.alfu32.sketch

data class K3DVersion(
  val buildGitCommit:String = "${commit}",
  val buildDate:String = "${buildDate}",
  val buildGitBranch:String = "${branch}",
  val buildGitTag:String = "${tag}",
  val buildVersion:String = "${buildVersion}"
)
"""
  }
}

tasks.register('generateBuildFlags') {
  def outFile = file("src/main/kotlin/com/github/alfu32/sketch/BuildFlags.kt")
  def webBuildProvider = providers.provider {
    def explicit = project.findProperty("webBuild")
    def taskNames = gradle.startParameter.taskNames
    def inferredWeb = taskNames.any { name ->
      def lower = name.toLowerCase()
      lower.contains(":web:") || lower.startsWith("web:")
    }
    explicit != null ? explicit.toString().toBoolean() : inferredWeb
  }
  inputs.property("webBuild", webBuildProvider)
  outputs.file(outFile)
  doLast {
    def webBuild = webBuildProvider.get()
    outFile.parentFile.mkdirs()
    outFile.text = """package com.github.alfu32.sketch

object BuildFlags {
  const val WEB_BUILD: Boolean = ${webBuild}
}
"""
  }
}

tasks.named('compileKotlin') {
  dependsOn 'generateK3DVersion', 'generateBuildFlags'
  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

tasks.named('compileJava') {
  dependsOn 'generateK3DVersion', 'generateBuildFlags'
}

tasks.named('compileTestKotlin') {
  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

tasks.register('copyPluginApiJar', Copy) {
  dependsOn 'pluginApiJar'
  from tasks.named('pluginApiJar').flatMap { it.archiveFile }
  into "${rootProject.rootDir}/dist/plugins"
}

tasks.register('copySamplePlugins', Copy) {
  from "${rootProject.rootDir}/scripts"
  include '**/*.groovy'
  exclude 'polyline.groovy'
  into "${rootProject.rootDir}/dist/plugins"
}

tasks.register('preparePlugins') {
  dependsOn 'copyPluginApiJar', 'copySamplePlugins'
}
