
buildscript {
  repositories {
    gradlePluginPortal()
  }
  dependencies {
    classpath "io.github.fourlastor:construo:2.1.0"
    if(enableGraalNative == 'true') {
      classpath "org.graalvm.buildtools.native:org.graalvm.buildtools.native.gradle.plugin:0.9.28"
    }
  }
}
plugins {
  id "application"
}
apply plugin: 'io.github.fourlastor.construo'
apply plugin: 'org.jetbrains.kotlin.jvm'


import io.github.fourlastor.construo.Target

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application.mainClass = 'com.github.alfu32.sketch.lwjgl3.Lwjgl3Launcher'
eclipse.project.name = appName + '-lwjgl3'
java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
        compileJava.options.release.set(21)
}
kotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

dependencies {
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-lwjgl3-angle:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation project(':core')
  implementation "net.java.dev.jna:jna:5.14.0"
  implementation "org.apache.groovy:groovy:4.0.21"
  implementation("com.badlogicgames.gdx:gdx-tools:$gdxVersion"){exclude group: 'com.badlogicgames.gdx', module: 'gdx-backend-lwjgl'}

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-backend-lwjgl3:$graalHelperVersion"
      implementation "io.github.berstanio:gdx-svmhelper-extension-freetype:$graalHelperVersion"

    }
}

def os = System.properties['os.name'].toLowerCase(Locale.ROOT)
def packagedJvmArgs = ["-Xms512m", "-Xmx6g"]

run {
  workingDir = rootProject.file('assets').path
// You can uncomment the next line if your IDE claims a build failure even when the app closed properly.
  //setIgnoreExitValue(true)

  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}

jar {
// sets the name of the .jar file this produces to the name of the game or app, with the version after.
  archiveFileName.set("${appName}-${projectVersion}.jar")
// the duplicatesStrategy matters starting in Gradle 7.0; this setting works.
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
// these "exclude" lines remove some unnecessary duplicate files in the output JAR.
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
// setting the manifest makes the JAR runnable.
// enabling native access helps avoid a warning when Java 24 or later runs the JAR.
  manifest {
    attributes 'Main-Class': application.mainClass, 'Enable-Native-Access': 'ALL-UNNAMED'
  }
// this last step may help on some OSes that need extra instruction to make runnable JARs.
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

// Builds a JAR that only includes the files needed to run on macOS, not Windows or Linux.
// The file size for a Mac-only JAR is about 7MB smaller than a cross-platform JAR.
tasks.register("jarMac") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Linux, not Windows or macOS.
// The file size for a Linux-only JAR is about 5MB smaller than a cross-platform JAR.
tasks.register("jarLinux") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Windows, not Linux or macOS.
// The file size for a Windows-only JAR is about 6MB smaller than a cross-platform JAR.
tasks.register("jarWin") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
  jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so",
    'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
      'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

construo {
    // name of the executable
    name.set(appName)
    // human-readable name, used for example in the `.app` name for macOS
    humanName.set(appName)

    targets.configure {
      register("linuxX64", Target.Linux) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_linux_hotspot_17.0.15_6.tar.gz")
        // Linux does not currently have a way to set the icon on the executable
      }
      register("macM1", Target.MacOs) {
        architecture.set(Target.Architecture.AARCH64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.15_6.tar.gz")
        // macOS needs an identifier
        identifier.set("com.github.alfu32.sketch." + appName)
        // Optional: icon for macOS, as an ICNS file
        macIcon.set(project.file("icons/logo.icns"))
      }
      register("macX64", Target.MacOs) {
        architecture.set(Target.Architecture.X86_64)
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_mac_hotspot_17.0.15_6.tar.gz")
        // macOS needs an identifier
        identifier.set("com.github.alfu32.sketch." + appName)
        // Optional: icon for macOS, as an ICNS file
        macIcon.set(project.file("icons/logo.icns"))
      }
      register("winX64", Target.Windows) {
        architecture.set(Target.Architecture.X86_64)
        // Optional: icon for Windows, as a PNG
        icon.set(project.file("../assets/appicon.png"))
        jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.15%2B6/OpenJDK17U-jdk_x64_windows_hotspot_17.0.15_6.zip")
        // Uncomment the next line to show a console when the game runs, to print messages.
        //useConsole.set(true)
      }
    }
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}

distributions {
  main {
    contents {
      into('libs') {
        project.configurations.runtimeClasspath.files.findAll { file ->
          file.getName() != project.tasks.jar.outputs.files.singleFile.name
        }.each { file ->
          exclude file.name
        }
      }
    }
  }
}

startScripts.dependsOn(':lwjgl3:jar')
startScripts.classpath = project.tasks.jar.outputs.files

if(enableGraalNative == 'true') {
  apply from: file("nativeimage.gradle")
}

// -----------------------------------------------------------------------------
// App distribution bundling (per-OS with bundled JDK + plugins + docs).
// -----------------------------------------------------------------------------
def bundleVersion = (project.findProperty("releaseNumber") ?: projectVersion).toString()
def bundleJdkVersion = (project.findProperty("bundleJdkVersion") ?: "21.0.9+10").toString()
def bundleJdkTag = bundleJdkVersion.replace("+", "%2B")
def bundleJdkSuffix = bundleJdkVersion.replace("+", "_")
def temurinBase = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${bundleJdkTag}"
def jdkUrls = [
    linuxX64: project.findProperty("bundleJdkLinuxUrl") ?: "${temurinBase}/OpenJDK21U-jre_x64_linux_hotspot_${bundleJdkSuffix}.tar.gz",
    winX64  : project.findProperty("bundleJdkWinUrl") ?: "${temurinBase}/OpenJDK21U-jre_x64_windows_hotspot_${bundleJdkSuffix}.zip",
    macArm64: project.findProperty("bundleJdkMacArmUrl") ?: "${temurinBase}/OpenJDK21U-jre_aarch64_mac_hotspot_${bundleJdkSuffix}.tar.gz"
]

def jdkCacheDir = file("$buildDir/jdk-cache")
def launcherDir = file("$buildDir/generated/launchers")

def resolveJdkRoot = { File cacheDir ->
  if (!cacheDir.exists()) {
    return cacheDir
  }
  def candidates = cacheDir.listFiles().findAll { it.isDirectory() }
  if (candidates.size() == 1) {
    return candidates.first()
  }
  def javaFiles = project.fileTree(cacheDir) {
    include "**/bin/java"
    include "**/bin/java.exe"
    include "**/Contents/Home/bin/java"
  }.files
  if (!javaFiles.isEmpty()) {
    def best = javaFiles.min { it.absolutePath.length() }
    def path = best.absolutePath.replace("\\", "/")
    if (path.endsWith("/Contents/Home/bin/java")) {
      return best.parentFile.parentFile.parentFile.parentFile
    }
    return best.parentFile.parentFile
  }
  def direct = candidates.find {
    new File(it, "bin/java").exists() ||
      new File(it, "bin/java.exe").exists() ||
      new File(it, "Contents/Home/bin/java").exists()
  }
  return direct ?: cacheDir
}

def downloadAndExtractJdk = { String url, File cacheDir ->
  if (cacheDir.exists() && cacheDir.listFiles()?.length > 0) {
    return
  }
  cacheDir.mkdirs()
  def archiveName = url.tokenize('/').last()
  def archiveFile = new File(cacheDir, archiveName)
  if (!archiveFile.exists()) {
    ant.get(src: url, dest: archiveFile, skipexisting: true, verbose: true)
  }
  if (archiveName.endsWith(".zip")) {
    ant.unzip(src: archiveFile, dest: cacheDir)
  } else if (archiveName.endsWith(".tar.gz")) {
    ant.untar(src: archiveFile, dest: cacheDir, compression: "gzip")
  } else {
    throw new GradleException("Unsupported JDK archive: ${archiveName}")
  }
}

def createUnixLauncher = { File outFile ->
  outFile.parentFile.mkdirs()
  outFile.text = """#!/bin/bash
set -euo pipefail
INSTALL_PATH="\$(cd "\$(dirname "\$0")" && pwd)"
DEFAULT_JAVA_OPTS=(${packagedJvmArgs.collect { "\"${it}\"" }.join(' ')})
if [[ -n "\${OCTODRAW_JAVA_OPTS:-}" ]]; then
  # shellcheck disable=SC2206
  JAVA_OPTS=(\${OCTODRAW_JAVA_OPTS})
else
  JAVA_OPTS=("\${DEFAULT_JAVA_OPTS[@]}")
fi
PLUGINS_DIR="\${OCTODRAW_PLUGINS_DIR:-\${K3D_PLUGINS_DIR:-}}"
if [[ -z "\$PLUGINS_DIR" ]]; then
  PLUGINS_DIR="\$INSTALL_PATH/plugins"
fi
if [[ -z "\${1-}" ]]; then
  java "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" edit --plugins-dir "\$PLUGINS_DIR"
  exit \$?
fi
case "\$1" in
  edit|version|update|help)
    java "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" "\$@" --plugins-dir "\$PLUGINS_DIR"
    ;;
  *)
    java "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" edit --file "\$1" --plugins-dir "\$PLUGINS_DIR"
    ;;
esac
"""
}

def createUnixJreLauncher = { File outFile ->
  outFile.parentFile.mkdirs()
  outFile.text = """#!/bin/bash
set -euo pipefail
INSTALL_PATH="\$(cd "\$(dirname "\$0")" && pwd)"
JAVA_BIN="\$INSTALL_PATH/jre/bin/java"
if [[ ! -x "\$JAVA_BIN" && -x "\$INSTALL_PATH/jre/Contents/Home/bin/java" ]]; then
  JAVA_BIN="\$INSTALL_PATH/jre/Contents/Home/bin/java"
fi
DEFAULT_JAVA_OPTS=(${packagedJvmArgs.collect { "\"${it}\"" }.join(' ')})
if [[ -n "\${OCTODRAW_JAVA_OPTS:-}" ]]; then
  # shellcheck disable=SC2206
  JAVA_OPTS=(\${OCTODRAW_JAVA_OPTS})
else
  JAVA_OPTS=("\${DEFAULT_JAVA_OPTS[@]}")
fi
PLUGINS_DIR="\${OCTODRAW_PLUGINS_DIR:-\${K3D_PLUGINS_DIR:-}}"
if [[ -z "\$PLUGINS_DIR" ]]; then
  PLUGINS_DIR="\$INSTALL_PATH/plugins"
fi
if [[ -z "\${1-}" ]]; then
  "\$JAVA_BIN" "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" edit --plugins-dir "\$PLUGINS_DIR"
  exit \$?
fi
case "\$1" in
  edit|version|update|help)
    "\$JAVA_BIN" "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" "\$@" --plugins-dir "\$PLUGINS_DIR"
    ;;
  *)
    "\$JAVA_BIN" "\${JAVA_OPTS[@]}" -jar "\$INSTALL_PATH/octodraw-editor.jar" edit --file "\$1" --plugins-dir "\$PLUGINS_DIR"
    ;;
esac
"""
}

def createWindowsLauncher = { File outFile ->
  outFile.parentFile.mkdirs()
  outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"
set "JAVA_OPTS=-Xms512m -Xmx6g"
if not "%OCTODRAW_JAVA_OPTS%"=="" set "JAVA_OPTS=%OCTODRAW_JAVA_OPTS%"
set "PLUGINS_DIR=%APP_DIR%\\plugins"
if not "%OCTODRAW_PLUGINS_DIR%"=="" set "PLUGINS_DIR=%OCTODRAW_PLUGINS_DIR%"
if "%OCTODRAW_PLUGINS_DIR%"=="" if not "%K3D_PLUGINS_DIR%"=="" set "PLUGINS_DIR=%K3D_PLUGINS_DIR%"
if "%OCTODRAW_PLUGINS_DIR%%K3D_PLUGINS_DIR%"=="" (
  for /d %%D in ("%LOCALAPPDATA%\\Packages\\*k3d*") do (
    if exist "%%D\\LocalState" (
      set "PLUGINS_DIR=%%D\\LocalState\\plugins"
      goto plugins_done
    )
  )
)
:plugins_done
if "%~1"=="" (
  java %JAVA_OPTS% -jar "%APP_DIR%\\octodraw-editor.jar" edit --plugins-dir "%PLUGINS_DIR%"
  exit /b %ERRORLEVEL%
)
if /I "%~1"=="edit" goto run
if /I "%~1"=="version" goto run
if /I "%~1"=="update" goto run
if /I "%~1"=="help" goto run
java %JAVA_OPTS% -jar "%APP_DIR%\\octodraw-editor.jar" edit --file "%~1" --plugins-dir "%PLUGINS_DIR%"
exit /b %ERRORLEVEL%
:run
java %JAVA_OPTS% -jar "%APP_DIR%\\octodraw-editor.jar" %* --plugins-dir "%PLUGINS_DIR%"
exit /b %ERRORLEVEL%
"""
}

