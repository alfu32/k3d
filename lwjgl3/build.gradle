def createWindowsInstall = { File outFile ->
  outFile.parentFile.mkdirs()
  outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"

echo Registering Octodraw path: %APP_DIR%
setx PATH "%PATH%;%APP_DIR%" >nul

echo Registering .octd file association...
reg add "HKCU\\Software\\Classes\\.octd" /ve /d "OctodrawFile" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile" /ve /d "Octodraw File" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile\\DefaultIcon" /ve /d "%APP_DIR%\\appicon.png" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile\\shell\\open\\command" /ve /d "\\"%APP_DIR%\\octodraw.cmd\\" \\"%%1\\"" /f >nul

echo Done. You may need to restart your shell for PATH changes to apply.
pause
"""
}

def createSnapMetadata = { File snapRoot ->
  def metaDir = new File(snapRoot, "meta")
  def guiDir = new File(metaDir, "gui")
  guiDir.mkdirs()
  new File(metaDir, "snap.yaml").text = """name: octodraw
title: Octodraw
version: "${bundleVersion}"
summary: 3D drafting and modeling tool
description: |
  Octodraw is a 3D drafting and modeling application.
base: core22
grade: stable
confinement: strict
icon: meta/gui/icon.png
apps:
  octodraw:
    command: octodraw-jre
    desktop: meta/gui/octodraw.desktop
    environment:
      OCTODRAW_PLUGINS_DIR: \$SNAP_USER_COMMON/plugins
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - wayland
      - x11
      - audio-playback
      - removable-media
"""
  new File(guiDir, "octodraw.desktop").text = """[Desktop Entry]
Name=Octodraw
Comment=3D drafting and modeling tool
Exec=octodraw %U
Icon=\${SNAP}/meta/gui/icon.png
Terminal=false
Type=Application
Categories=Graphics;3DGraphics;Engineering;
MimeType=application/octet-stream;
"""
  ant.copy(file: rootProject.file("assets/appicon.png"), tofile: new File(guiDir, "icon.png"))
}

tasks.register("fetchJdkLinux") {
  outputs.dir file("$jdkCacheDir/linux-x64")
