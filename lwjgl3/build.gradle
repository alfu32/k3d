tasks.register("generateWindowsLauncher") {
  outputs.file file("$launcherDir/octodraw.cmd")
  doLast { createWindowsLauncher(file("$launcherDir/octodraw.cmd")) }
}

tasks.register("generateWindowsJreLauncher") {
  outputs.file file("$launcherDir/octodraw-jre.cmd")
  doLast { createWindowsJreLauncher(file("$launcherDir/octodraw-jre.cmd")) }
}

tasks.register("generateWindowsInstall") {
  outputs.file file("$launcherDir/octodraw.install.cmd")
  doLast { createWindowsInstall(file("$launcherDir/octodraw.install.cmd")) }
}

def configureBundleTask = { String name, String osLabel, TaskProvider jdkTask, File jdkCache, boolean includeUnixLauncher, boolean includeWindowsScripts ->
  tasks.register(name, Zip) {
    dependsOn "jar", jdkTask, ":core:pluginApiJar", "generateUnixLauncher", "generateUnixJreLauncher",
      "generateWindowsLauncher", "generateWindowsJreLauncher", "generateWindowsInstall"
    destinationDirectory.set(rootProject.file("dist"))
    archiveFileName.set("octodraw-dist-${bundleVersion}-${osLabel}.zip")
    def stagingDir = file("$buildDir/bundle/${name}")
    from(tasks.named("jar").flatMap { it.archiveFile }) {
      rename { "octodraw-editor.jar" }
    }
    from(rootProject.file("LICENSE.md"))
    from(rootProject.file("README.md"))
    from(rootProject.file("USER_MANUAL.md"))
    from(rootProject.file("SHORTCUTS.md"))
    from(rootProject.file("PLUGIN_DEVELOPMENT.md"))
    from(rootProject.file("assets/appicon.png"))
    from(rootProject.file("scripts")) {
      include("*.groovy")
      into("plugins")
    }
    from(rootProject.file("docs/tutorial")) {
      into("tutorials")
    }
    from(project(":core").tasks.named("pluginApiJar").flatMap { it.archiveFile }) {
      into("plugins")
    }
    from({ resolveJdkRoot(jdkCache) }) {
      into("jre")
      exclude("*.zip", "*.tar.gz", "*.tar")
    }
    if (includeUnixLauncher) {
      from(file("$launcherDir/octodraw-editor"))
      from(file("$launcherDir/octodraw-jre"))
    }
    if (includeWindowsScripts) {
      from(file("$launcherDir/octodraw.cmd"))
      from(file("$launcherDir/octodraw-jre.cmd"))
      from(file("$launcherDir/octodraw.install.cmd"))
    }
  }
}

def configureBundleTarTask = { String name, String osLabel, TaskProvider jdkTask, File jdkCache, boolean includeUnixLauncher ->
  tasks.register(name, Tar) {
    dependsOn "jar", jdkTask, ":core:pluginApiJar", "generateUnixLauncher", "generateUnixJreLauncher"
    destinationDirectory.set(rootProject.file("dist"))
    archiveFileName.set("octodraw-dist-${bundleVersion}-${osLabel}.tar.gz")
    compression = Compression.GZIP
    from(tasks.named("jar").flatMap { it.archiveFile }) {
      rename { "octodraw-editor.jar" }
    }
    from(rootProject.file("LICENSE.md"))
    from(rootProject.file("README.md"))
    from(rootProject.file("USER_MANUAL.md"))
    from(rootProject.file("SHORTCUTS.md"))
    from(rootProject.file("PLUGIN_DEVELOPMENT.md"))
    from(rootProject.file("assets/appicon.png"))
    from(rootProject.file("scripts")) {
      include("*.groovy")
      into("plugins")
    }
    from(rootProject.file("docs/tutorial")) {
      into("tutorials")
    }
    from(project(":core").tasks.named("pluginApiJar").flatMap { it.archiveFile }) {
      into("plugins")
    }
    from({ resolveJdkRoot(jdkCache) }) {
      into("jre")
      exclude("*.zip", "*.tar.gz", "*.tar")
    }
    if (includeUnixLauncher) {
      from(file("$launcherDir/octodraw-editor"))
      from(file("$launcherDir/octodraw-jre"))
    }
  }
}

def configureBundleDirTask = { String name, String osLabel, TaskProvider jdkTask, File jdkCache, boolean includeUnixLauncher, boolean includeWindowsScripts ->
  tasks.register(name, Sync) {
    dependsOn "jar", jdkTask, ":core:pluginApiJar", "generateUnixLauncher", "generateUnixJreLauncher",
      "generateWindowsLauncher", "generateWindowsJreLauncher", "generateWindowsInstall"
    def targetDir = rootProject.file("dist/octodraw-dist-${bundleVersion}-${osLabel}")
    into(targetDir)
    from(tasks.named("jar").flatMap { it.archiveFile }) {
      rename { "octodraw-editor.jar" }
    }
    from(rootProject.file("LICENSE.md"))
    from(rootProject.file("README.md"))
    from(rootProject.file("USER_MANUAL.md"))
    from(rootProject.file("SHORTCUTS.md"))
    from(rootProject.file("PLUGIN_DEVELOPMENT.md"))
    from(rootProject.file("assets/appicon.png"))
    from(rootProject.file("scripts")) {
      include("*.groovy")
      into("plugins")
    }
    from(rootProject.file("docs/tutorial")) {
      into("tutorials")
    }
    from(project(":core").tasks.named("pluginApiJar").flatMap { it.archiveFile }) {
      into("plugins")
    }
    from({ resolveJdkRoot(jdkCache) }) {
      into("jre")
      exclude("*.zip", "*.tar.gz", "*.tar")
    }
    if (includeUnixLauncher) {
      from(file("$launcherDir/octodraw-editor"))
      from(file("$launcherDir/octodraw-jre"))
    }
    if (includeWindowsScripts) {
      from(file("$launcherDir/octodraw.cmd"))
      from(file("$launcherDir/octodraw-jre.cmd"))
      from(file("$launcherDir/octodraw.install.cmd"))
    }
    doLast {
      if (includeUnixLauncher) {
        def editor = new File(destinationDir, "octodraw-editor")
        def jre = new File(destinationDir, "octodraw-jre")
        if (editor.exists()) editor.setExecutable(true, false)
        if (jre.exists()) jre.setExecutable(true, false)
      }
    }
  }
}

configureBundleTask("bundleLinux", "linux", tasks.named("fetchJdkLinux"), file("$jdkCacheDir/linux-x64"), true, false)
configureBundleTask("bundleWin", "win", tasks.named("fetchJdkWin"), file("$jdkCacheDir/win-x64"), false, true)
configureBundleTask("bundleMacArm64", "mac", tasks.named("fetchJdkMacArm64"), file("$jdkCacheDir/mac-arm64"), true, false)
configureBundleTarTask("bundleLinuxTar", "linux", tasks.named("fetchJdkLinux"), file("$jdkCacheDir/linux-x64"), true)
configureBundleTarTask("bundleMacArm64Tar", "mac", tasks.named("fetchJdkMacArm64"), file("$jdkCacheDir/mac-arm64"), true)

tasks.register("bundleLinuxSnap") {
  dependsOn "bundleLinuxDir"
  outputs.file rootProject.file("dist/octodraw-dist-${bundleVersion}-linux.snap")
  doLast {
    if (!os.contains("linux")) {
      throw new GradleException("Snap packaging is only supported on Linux hosts.")
    }
    def mksquashfs = ["bash", "-lc", "command -v mksquashfs >/dev/null 2>&1"]
    def probe = exec {
      ignoreExitValue = true
      commandLine mksquashfs
    }
    if (probe.exitValue != 0) {
      throw new GradleException("mksquashfs not found. Install squashfs-tools to build the Snap package.")
    }
    def sourceDir = rootProject.file("dist/octodraw-dist-${bundleVersion}-linux")
    if (!sourceDir.exists()) {
      throw new GradleException("Linux bundle directory not found: ${sourceDir}")
    }
    def snapRoot = file("$buildDir/snap/octodraw")
    delete snapRoot
    copy {
      from(sourceDir)
      into(snapRoot)
    }
    createSnapMetadata(snapRoot)
    def outFile = rootProject.file("dist/octodraw-dist-${bundleVersion}-linux.snap")
    delete outFile
    exec {
      commandLine "mksquashfs", snapRoot.absolutePath, outFile.absolutePath, "-noappend", "-comp", "xz", "-all-root", "-no-xattrs"
    }
  }
}

tasks.register("bundleAll") {
  dependsOn "bundleLinuxTar", "bundleWin", "bundleMacArm64Tar"
}

tasks.register("bundleLocal") {
  def osName = System.properties['os.name'].toLowerCase(Locale.ROOT)
  if (osName.contains("win")) {
    dependsOn "bundleWin"
  } else if (osName.contains("mac")) {
    dependsOn "bundleMacArm64Tar"
  } else {
    dependsOn "bundleLinuxTar", "bundleLinuxSnap"
  }
}

configureBundleDirTask("bundleLinuxDir", "linux", tasks.named("fetchJdkLinux"), file("$jdkCacheDir/linux-x64"), true, false)
configureBundleDirTask("bundleWinDir", "win", tasks.named("fetchJdkWin"), file("$jdkCacheDir/win-x64"), false, true)
configureBundleDirTask("bundleMacArm64Dir", "mac", tasks.named("fetchJdkMacArm64"), file("$jdkCacheDir/mac-arm64"), true, false)

tasks.register("bundleLocalDir") {
  def osName = System.properties['os.name'].toLowerCase(Locale.ROOT)
  if (osName.contains("win")) {
    dependsOn "bundleWinDir"
  } else if (osName.contains("mac")) {
    dependsOn "bundleMacArm64Dir"
  } else {
    dependsOn "bundleLinuxDir"
  }
}

tasks.register("dev") {
  dependsOn "bundleLocalDir"
  if (os.contains("linux")) {
    dependsOn "bundleLinuxSnap"
  }
}
