}

tasks.register("fetchJdkMacArm64") {
  outputs.dir file("$jdkCacheDir/mac-arm64")
  doLast { downloadAndExtractJdk(jdkUrls.macArm64, file("$jdkCacheDir/mac-arm64")) }
