def createWindowsInstall = { File outFile ->
  outFile.parentFile.mkdirs()
  outFile.text = """@echo off
setlocal
set "APP_DIR=%~dp0"
set "APP_DIR=%APP_DIR:~0,-1%"

echo Registering Octodraw path: %APP_DIR%
setx PATH "%PATH%;%APP_DIR%" >nul

echo Registering .octd file association...
reg add "HKCU\\Software\\Classes\\.octd" /ve /d "OctodrawFile" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile" /ve /d "Octodraw File" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile\\DefaultIcon" /ve /d "%APP_DIR%\\appicon.png" /f >nul
reg add "HKCU\\Software\\Classes\\OctodrawFile\\shell\\open\\command" /ve /d "\\"%APP_DIR%\\octodraw.cmd\\" \\"%%1\\"" /f >nul

echo Done. You may need to restart your shell for PATH changes to apply.
pause
"""
}

def createSnapMetadata = { File snapRoot ->
  def metaDir = new File(snapRoot, "meta")
  def guiDir = new File(metaDir, "gui")
  def binDir = new File(snapRoot, "bin")
  guiDir.mkdirs()
  binDir.mkdirs()
  new File(metaDir, "snap.yaml").text = """name: octodraw
title: Octodraw
version: "${bundleVersion}"
summary: 3D drafting and modeling tool
description: |
  Octodraw is a 3D drafting and modeling application.
architectures:
  - amd64
base: core22
grade: stable
confinement: strict
apps:
  octodraw:
    command: bin/octodraw-launch
    environment:
      OCTODRAW_PLUGINS_DIR: \$SNAP_USER_COMMON/plugins
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - wayland
      - x11
      - audio-playback
      - removable-media
"""
  new File(guiDir, "octodraw.desktop").text = """[Desktop Entry]
Name=Octodraw
Comment=3D drafting and modeling tool
Exec=octodraw %U
Icon=\${SNAP}/meta/gui/icon.png
Terminal=false
Type=Application
Categories=Graphics;3DGraphics;Engineering;
MimeType=application/octet-stream;
"""
  def launchFile = new File(binDir, "octodraw-launch")
  launchFile.text = '''#!/bin/sh
set -eu

HOST_RUNTIME_DIR="/run/user/$(id -u)"
CURRENT_RUNTIME_DIR="${XDG_RUNTIME_DIR:-}"
SNAP_LIB_DIR="$SNAP/lib"
SNAP_USR_LIB_DIR="$SNAP/usr/lib/x86_64-linux-gnu"
SNAP_DRI_DIR="$SNAP_USR_LIB_DIR/dri"
SNAP_EGL_VENDOR_DIR="$SNAP/usr/share/glvnd/egl_vendor.d"
SNAP_ALSA_CONF="$SNAP/usr/share/alsa/alsa.conf"

if [ -d "$SNAP_LIB_DIR" ]; then
  export LD_LIBRARY_PATH="$SNAP_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
fi

if [ -d "$SNAP_USR_LIB_DIR" ]; then
  export LD_LIBRARY_PATH="$SNAP_USR_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
fi

if [ -z "$CURRENT_RUNTIME_DIR" ] || [ ! -d "$CURRENT_RUNTIME_DIR" ]; then
  export XDG_RUNTIME_DIR="$HOST_RUNTIME_DIR"
fi

if [ -z "${WAYLAND_DISPLAY:-}" ] && [ -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
  export WAYLAND_DISPLAY=wayland-0
fi

if [ -z "${DISPLAY:-}" ] && [ -S "/tmp/.X11-unix/X0" ]; then
  export DISPLAY=:0
fi

if [ -z "${XAUTHORITY:-}" ] && [ -f "$HOME/.Xauthority" ]; then
  export XAUTHORITY="$HOME/.Xauthority"
fi

if [ -d "$SNAP_DRI_DIR" ]; then
  export LIBGL_DRIVERS_PATH="$SNAP_DRI_DIR"
fi

if [ -d "$SNAP_EGL_VENDOR_DIR" ]; then
  export __EGL_VENDOR_LIBRARY_DIRS="$SNAP_EGL_VENDOR_DIR"
fi

if [ -f "$SNAP_ALSA_CONF" ]; then
  export ALSA_CONFIG_PATH="$SNAP_ALSA_CONF"
fi

exec "$SNAP/octodraw-jre" "$@"
'''
  launchFile.setExecutable(true, false)
  ant.copy(file: rootProject.file("assets/appicon.png"), tofile: new File(guiDir, "icon.png"))
}

def copySnapDesktopRuntimeLibs = { File snapRoot ->
  def libDir = new File(snapRoot, "lib")
  def usrLibDir = new File(snapRoot, "usr/lib/x86_64-linux-gnu")
  def usrShareDir = new File(snapRoot, "usr/share")
  libDir.mkdirs()
  usrLibDir.mkdirs()
  usrShareDir.mkdirs()
  def searchRoots = [
    file("/usr/lib/x86_64-linux-gnu"),
    file("/lib/x86_64-linux-gnu"),
    file("/usr/lib64"),
    file("/lib64"),
  ].findAll { it.exists() }
  def requiredLibs = [
    "libX11.so.6",
    "libXext.so.6",
    "libXcursor.so.1",
    "libXrandr.so.2",
    "libXinerama.so.1",
    "libXi.so.6",
    "libXxf86vm.so.1",
    "libxcb.so.1",
    "libXau.so.6",
    "libXdmcp.so.6",
    "libwayland-client.so.0",
    "libwayland-cursor.so.0",
    "libwayland-egl.so.1",
    "libxkbcommon.so.0",
    "libdecor-0.so.0",
    "libGL.so.1",
    "libGLX.so.0",
    "libEGL.so.1",
    "libGLX_mesa.so.0",
    "libEGL_mesa.so.0",
    "libGLdispatch.so.0",
    "libOpenGL.so.0",
    "libGLESv2.so.2",
    "libdrm.so.2",
    "libdrm_amdgpu.so.1",
    "libdrm_intel.so.1",
    "libdrm_nouveau.so.2",
    "libdrm_radeon.so.1",
    "libgbm.so.1",
    "libasound.so.2",
  ]
  requiredLibs.each { libName ->
    def source = searchRoots.collect { new File(it, libName) }.find { it.exists() }
    if (source != null) {
      ant.copy(file: source, tofile: new File(libDir, libName), overwrite: true)
      ant.copy(file: source, tofile: new File(usrLibDir, libName), overwrite: true)
    }
  }
  def driSourceDir = file("/usr/lib/x86_64-linux-gnu/dri")
  if (driSourceDir.exists()) {
    ant.copy(todir: new File(usrLibDir, "dri"), overwrite: true) {
      fileset(dir: driSourceDir)
    }
  }
  def glvndSourceDir = file("/usr/share/glvnd/egl_vendor.d")
  if (glvndSourceDir.exists()) {
    ant.copy(todir: new File(usrShareDir, "glvnd/egl_vendor.d"), overwrite: true) {
      fileset(dir: glvndSourceDir)
    }
  }
  def alsaSourceDir = file("/usr/share/alsa")
  if (alsaSourceDir.exists()) {
    ant.copy(todir: new File(usrShareDir, "alsa"), overwrite: true) {
      fileset(dir: alsaSourceDir)
    }
  }
}

def ensureUnixRuntimeExecutables = { File installDir ->
  ["octodraw-editor", "octodraw-jre"].each { name ->
    def launcher = new File(installDir, name)
    if (launcher.exists()) {
      launcher.setExecutable(true, false)
      launcher.setReadable(true, false)
    }
  }
  def javaBinDir = new File(installDir, "jre/bin")
  if (javaBinDir.exists()) {
    javaBinDir.eachFileRecurse { file ->
      if (file.isFile()) {
        file.setExecutable(true, false)
        file.setReadable(true, false)
      }
    }
  }
  ["jre/lib/jspawnhelper", "jre/lib/jexec"].each { relPath ->
    def helper = new File(installDir, relPath)
    if (helper.exists()) {
      helper.setExecutable(true, false)
      helper.setReadable(true, false)
    }
  }
}

