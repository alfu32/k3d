name: octodraw
title: Octodraw
base: core24
adopt-info: octodraw
summary: 3D drafting and modeling tool
description: |
  Octodraw is a 3D drafting and modeling application packaged directly
  from the repository Gradle build. The snap ships the fat desktop jar,
  runtime assets, tutorials, and a bundled JRE 21 built with jlink.
icon: snap/gui/icon.png

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  octodraw:
    command: bin/octodraw
    desktop: snap/gui/octodraw.desktop
    environment:
      OCTODRAW_HOME: $SNAP_USER_COMMON
      K3D_HOME: $SNAP_USER_COMMON
      OCTODRAW_PLUGINS_DIR: $SNAP_USER_COMMON/plugins
      K3D_PLUGINS_DIR: $SNAP_USER_COMMON/plugins
      ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
    plugs:
      - desktop
      - desktop-legacy
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - wayland
      - x11
      - audio-playback

parts:
  octodraw:
    plugin: nil
    source: .
    build-packages:
      - git
      - openjdk-21-jdk-headless
    stage-packages:
      - libharfbuzz0b
      - libasound2t64
      - libasound2-data
      - alsa-topology-conf
      - alsa-ucm-conf
      - libgif7
      - libdrm2
      - libegl1
      - libgbm1
      - libgl1
      - libgles2
      - libgl1-mesa-dri
      - libglx-mesa0
      - libglu1-mesa
      - libopengl0
      - libjpeg-turbo8
      - liblcms2-2
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - libxtst6
      - libxxf86vm1
    override-build: |
      set -eux

      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
      export GRADLE_USER_HOME="$CRAFT_PART_BUILD/.gradle"
      export PATH="$JAVA_HOME/bin:$PATH"
      SNAP_VERSION="${OCTODRAW_SNAP_VERSION:-$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0)}"

      if [ -d .gradle-user/wrapper/dists ]; then
        install -d "$GRADLE_USER_HOME/wrapper"
        cp -a .gradle-user/wrapper/dists "$GRADLE_USER_HOME/wrapper/"
      fi

      chmod 755 ./gradlew
      ./gradlew --no-daemon -PreleaseNumber="$SNAP_VERSION" generateAssetList :lwjgl3:jar

      APP_JAR="lwjgl3/build/libs/octodraw-$SNAP_VERSION.jar"
      if [ ! -f "$APP_JAR" ]; then
        APP_JAR="$(find lwjgl3/build/libs -maxdepth 1 -type f -name 'octodraw-*.jar' ! -name '*-linux.jar' ! -name '*-mac.jar' ! -name '*-win.jar' -printf '%T@ %p\n' | sort -nr | awk 'NR==1 {print $2}')"
      fi
      if [ -z "$APP_JAR" ]; then
        echo "Unable to locate built desktop jar." >&2
        exit 1
      fi

      MODULES_RAW="$("$JAVA_HOME/bin/jdeps" \
        --ignore-missing-deps \
        --multi-release 21 \
        --print-module-deps \
        "$APP_JAR"),jdk.crypto.ec,jdk.unsupported"
      MODULES="$(printf '%s\n' "$MODULES_RAW" | tr ',' '\n' | sed '/^$/d' | sort -u | paste -sd, -)"

      install -d "$CRAFT_PART_INSTALL/opt/octodraw"
      install -d "$CRAFT_PART_INSTALL/opt/octodraw/plugins"
      install -d "$CRAFT_PART_INSTALL/bin"
      install -d "$CRAFT_PART_INSTALL/snap/gui"
      rm -rf "$CRAFT_PART_INSTALL/opt/octodraw/runtime"

      "$JAVA_HOME/bin/jlink" \
        --add-modules "$MODULES" \
        --strip-debug \
        --no-header-files \
        --no-man-pages \
        --compress=2 \
        --output "$CRAFT_PART_INSTALL/opt/octodraw/runtime"

      install -m 0644 "$APP_JAR" "$CRAFT_PART_INSTALL/opt/octodraw/octodraw-editor.jar"

      cp -a assets "$CRAFT_PART_INSTALL/opt/octodraw/"
      if [ -d docs/tutorial ]; then
        install -d "$CRAFT_PART_INSTALL/opt/octodraw/tutorials"
        cp -a docs/tutorial/. "$CRAFT_PART_INSTALL/opt/octodraw/tutorials/"
      fi
      install -m 0644 snap/gui/octodraw.desktop "$CRAFT_PART_INSTALL/snap/gui/octodraw.desktop"
      install -m 0644 snap/gui/icon.png "$CRAFT_PART_INSTALL/snap/gui/icon.png"
      cat > "$CRAFT_PART_INSTALL/bin/octodraw" <<'EOF'
      #!/bin/sh
      set -eu

      INSTALL_PATH="$SNAP/opt/octodraw"
      JAVA_BIN="$INSTALL_PATH/runtime/bin/java"
      RUNTIME_HOME="${OCTODRAW_HOME:-${K3D_HOME:-$SNAP_USER_COMMON}}"
      mkdir -p "$RUNTIME_HOME" "$RUNTIME_HOME/.prefs" "$RUNTIME_HOME/.config"
      export HOME="$RUNTIME_HOME"
      export XDG_DATA_HOME="$RUNTIME_HOME"
      export XDG_CONFIG_HOME="$RUNTIME_HOME/.config"
      PLUGINS_DIR="${OCTODRAW_PLUGINS_DIR:-${K3D_PLUGINS_DIR:-}}"
      if [ -z "$PLUGINS_DIR" ]; then
        PLUGINS_DIR="$SNAP_USER_COMMON/plugins"
      fi
      mkdir -p "$PLUGINS_DIR"

      if [ -z "${1-}" ]; then
        exec "$JAVA_BIN" -Duser.home="$RUNTIME_HOME" -jar "$INSTALL_PATH/octodraw-editor.jar" edit --plugins-dir "$PLUGINS_DIR"
      fi

      case "$1" in
        edit|version|update|help)
          exec "$JAVA_BIN" -Duser.home="$RUNTIME_HOME" -jar "$INSTALL_PATH/octodraw-editor.jar" "$@" --plugins-dir "$PLUGINS_DIR"
          ;;
        *)
          exec "$JAVA_BIN" -Duser.home="$RUNTIME_HOME" -jar "$INSTALL_PATH/octodraw-editor.jar" edit --file "$1" --plugins-dir "$PLUGINS_DIR"
          ;;
      esac
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/bin/octodraw"

      craftctl set version="$SNAP_VERSION"
