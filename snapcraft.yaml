name: octodraw
title: Octodraw
summary: 3D drafting and modeling tool
description: |
  Octodraw is a 3D drafting and modeling application.
base: core22
grade: stable
confinement: strict
adopt-info: octodraw

architectures:
  - build-on:
      - amd64
    build-for:
      - amd64

apps:
  octodraw:
    command: octodraw-jre
    environment:
      OCTODRAW_PLUGINS_DIR: $SNAP_USER_COMMON/plugins
      ALSA_CONFIG_PATH: $SNAP/usr/share/alsa/alsa.conf
    plugs:
      - audio-playback
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - opengl
      - removable-media
      - wayland
      - x11

parts:
  octodraw:
    plugin: dump
    source: source
    stage-packages:
      - libasound2
      - libasound2-data
      - libdrm2
      - libegl1
      - libgbm1
      - libgl1
      - libgl1-mesa-dri
      - libglx-mesa0
      - libglu1-mesa
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxrandr2
      - libxrender1
      - libxxf86vm1
    override-pull: |
      craftctl default
      craftctl set version "${OCTODRAW_SNAP_VERSION:-0.0.0}"
    override-build: |
      craftctl default
      chmod 755 "$CRAFT_PART_INSTALL/octodraw-editor" "$CRAFT_PART_INSTALL/octodraw-jre"
      if [ -d "$CRAFT_PART_INSTALL/jre/bin" ]; then
        find "$CRAFT_PART_INSTALL/jre/bin" -type f -exec chmod 755 {} \;
      fi
      if [ -f "$CRAFT_PART_INSTALL/jre/lib/jspawnhelper" ]; then
        chmod 755 "$CRAFT_PART_INSTALL/jre/lib/jspawnhelper"
      fi
      if [ -f "$CRAFT_PART_INSTALL/jre/lib/jexec" ]; then
        chmod 755 "$CRAFT_PART_INSTALL/jre/lib/jexec"
      fi
