plugins {
  id 'java-library'
}

java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(21)
}

def bundleVersion = (project.findProperty("releaseNumber") ?: project.version).toString()
def webOutputName = "octodraw-${bundleVersion}".replaceAll(/[^A-Za-z0-9._-]/, "-")
def webDistRoot = file("$buildDir/dist")
def webRuntimeDir = file("$webDistRoot/webapp")
def webRuntimeAssetsDir = file("$buildDir/generated/web-runtime-assets")
def webClasspathResourcesDir = file("$buildDir/generated/web-classpath-resources")
def webComponentSourceDir = file("$projectDir/component")
def webComponentBundleDir = file("$buildDir/dist/webcomponent")

configurations.configureEach {
  exclude group: 'org.apache.groovy', module: 'groovy'
}

dependencies {
  implementation(project(':core')) {
    exclude group: 'org.apache.groovy', module: 'groovy'
  }
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
}

tasks.register('prepareWebRuntimeAssets') {
  group = 'distribution'
  description = 'Builds merged TeaVM asset input (project assets + VisUI skin resources).'
  dependsOn(rootProject.tasks.named('generateAssetList'))

  doLast {
    delete(webRuntimeAssetsDir)
    webRuntimeAssetsDir.mkdirs()

    copy {
      from(rootProject.file('assets'))
      into(webRuntimeAssetsDir)
    }

    def visUiJar = configurations.runtimeClasspath.files.find { file ->
      file.name.startsWith('vis-ui-') && file.name.endsWith('.jar')
    }
    if (visUiJar == null || !visUiJar.exists()) {
      throw new GradleException("Unable to locate vis-ui runtime jar on web classpath.")
    }
    copy {
      from(zipTree(visUiJar)) {
        include 'com/kotcrab/vis/ui/skin/**'
        include 'com/kotcrab/vis/ui/widget/color/internal/**'
      }
      into(webRuntimeAssetsDir)
    }

    def assetsManifest = new File(webRuntimeAssetsDir, 'assets.txt')
    if (!assetsManifest.exists()) {
      throw new GradleException("Missing assets.txt in merged web assets: ${assetsManifest.absolutePath}")
    }
    def existingEntries = new LinkedHashSet<String>(assetsManifest.readLines('UTF-8'))
    def visUiEntries = fileTree(webRuntimeAssetsDir).matching {
      include 'com/kotcrab/vis/ui/skin/**'
      include 'com/kotcrab/vis/ui/widget/color/internal/**'
    }.files.collect { file ->
      file.absolutePath.substring(webRuntimeAssetsDir.absolutePath.length() + 1).replace('\\', '/')
    }.sort()
    visUiEntries.each { existingEntries.add(it) }
    assetsManifest.text = existingEntries.join('\n') + '\n'
  }
}

tasks.register('prepareWebClasspathResources') {
  group = 'build'
  description = 'Copies dependency classpath resources required by the TeaVM runtime.'

  doLast {
    delete(webClasspathResourcesDir)
    webClasspathResourcesDir.mkdirs()

    def visUiJar = configurations.runtimeClasspath.files.find { file ->
      file.name.startsWith('vis-ui-') && file.name.endsWith('.jar')
    }
    if (visUiJar == null || !visUiJar.exists()) {
      throw new GradleException("Unable to locate vis-ui runtime jar on web classpath.")
    }
    copy {
      from(zipTree(visUiJar)) {
        include 'com/kotcrab/vis/ui/skin/**'
        include 'com/kotcrab/vis/ui/widget/color/internal/**'
        exclude '**/*.class'
      }
      into(webClasspathResourcesDir)
    }
  }
}

tasks.named('processResources') {
  dependsOn(tasks.named('prepareWebClasspathResources'))
  from(webClasspathResourcesDir)
}

tasks.register('buildWebRuntime', JavaExec) {
  group = 'distribution'
  description = 'Compiles the real TeaVM/WebGL runtime.'
  dependsOn(tasks.named('classes'), tasks.named('prepareWebRuntimeAssets'))
  doFirst {
    delete(webDistRoot)
  }
  mainClass.set('com.github.alfu32.sketch.web.BuildWebApp')
  classpath = sourceSets.main.runtimeClasspath
  systemProperty('octodraw.web.output', webDistRoot.absolutePath)
  systemProperty('octodraw.web.folder', 'webapp')
  systemProperty('octodraw.web.assets', webRuntimeAssetsDir.absolutePath)
  systemProperty('octodraw.web.title', "Octodraw ${bundleVersion}")
  systemProperty('octodraw.web.outputName', webOutputName)
  systemProperty('octodraw.web.serve', 'false')
}

tasks.register('prepareWebDocs') {
  group = 'distribution'
  description = 'Copies docs into the TeaVM web runtime bundle.'
  dependsOn(tasks.named('buildWebRuntime'))

  inputs.dir(rootProject.file('docs'))
  inputs.file(rootProject.file('README.md'))
  inputs.file(rootProject.file('assets/appicon.png'))
  outputs.dir(webRuntimeDir)

  doLast {
    copy {
      from(rootProject.file('docs'))
      into(new File(webRuntimeDir, 'docs'))
      include('**/*.md')
      include('**/*.txt')
      exclude('downloads/**')
      exclude('tutorial/**')
      exclude('automation/**')
    }
    copy {
      from(rootProject.file('README.md'))
      into(webRuntimeDir)
    }
    copy {
      from(rootProject.file('assets/appicon.png'))
      into(new File(webRuntimeDir, 'assets'))
    }
  }
}

tasks.register('bundleWebZip', Zip) {
  group = 'distribution'
  description = 'Builds the TeaVM/WebGL runtime bundle (with docs) zip in dist/.'
  dependsOn(tasks.named('prepareWebDocs'))
  from(webRuntimeDir)
  destinationDirectory = rootProject.file('dist')
  archiveFileName = "octodraw-${bundleVersion}-webapp.zip"
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('prepareWebComponentBundle') {
  group = 'distribution'
  description = 'Builds the embeddable Octodraw web component bundle.'
  dependsOn(tasks.named('buildWebRuntime'))

  inputs.dir(webComponentSourceDir)
  inputs.dir(new File(webRuntimeDir, 'assets'))
  inputs.dir(new File(webRuntimeDir, 'scripts'))
  inputs.file(new File(webRuntimeDir, "${webOutputName}.js"))
  outputs.dir(webComponentBundleDir)

  doLast {
    delete(webComponentBundleDir)
    webComponentBundleDir.mkdirs()

    copy {
      from(new File(webRuntimeDir, 'assets'))
      into(new File(webComponentBundleDir, 'assets'))
    }
    copy {
      from(new File(webRuntimeDir, 'scripts'))
      into(new File(webComponentBundleDir, 'scripts'))
    }
    copy {
      from(new File(webRuntimeDir, "${webOutputName}.js"))
      into(webComponentBundleDir)
      rename { 'octodraw-runtime.js' }
    }
    copy {
      from(webComponentSourceDir)
      into(webComponentBundleDir)
    }
  }
}

tasks.register('bundleWebComponentZip', Zip) {
  group = 'distribution'
  description = 'Builds the embeddable Octodraw web component zip in dist/.'
  dependsOn(tasks.named('prepareWebComponentBundle'))
  from(webComponentBundleDir)
  destinationDirectory = rootProject.file('dist')
  archiveFileName = "octodraw-${bundleVersion}-webcomponent.zip"
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('bundleWeb') {
  group = 'distribution'
  description = 'Builds the single Octodraw webapp+docs zip artifact.'
  dependsOn(tasks.named('bundleWebZip'))
}
