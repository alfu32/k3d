plugins {
  id 'java-library'
}

java.sourceCompatibility = 21
java.targetCompatibility = 21
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(21)
}

def bundleVersion = (project.findProperty("releaseNumber") ?: project.version).toString()
def webDistRoot = file("$buildDir/dist")
def webRuntimeDir = file("$webDistRoot/webapp")

configurations.configureEach {
  exclude group: 'org.apache.groovy', module: 'groovy'
}

dependencies {
  implementation(project(':core')) {
    exclude group: 'org.apache.groovy', module: 'groovy'
  }
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"
}

tasks.register('copyWebRuntimeClasspathResources') {
  group = 'distribution'
  description = 'Copies required classpath resources (VisUI skin) into the TeaVM runtime assets.'

  doLast {
    def visUiJar = configurations.runtimeClasspath.files.find { file ->
      file.name.startsWith('vis-ui-') && file.name.endsWith('.jar')
    }
    if (visUiJar == null || !visUiJar.exists()) {
      throw new GradleException("Unable to locate vis-ui runtime jar on web classpath.")
    }
    copy {
      from(zipTree(visUiJar)) {
        include 'com/kotcrab/vis/ui/skin/**'
      }
      into(new File(webRuntimeDir, 'assets'))
    }

    // TeaVM runtime resolves internal assets through assets/assets.txt.
    // Ensure copied VisUI skin files are listed there so Gdx.files.internal(...) can find them.
    def assetsRoot = new File(webRuntimeDir, 'assets')
    def assetsManifest = new File(assetsRoot, 'assets.txt')
    if (!assetsManifest.exists()) {
      throw new GradleException("Missing TeaVM assets manifest: ${assetsManifest.absolutePath}")
    }

    def existingEntries = new LinkedHashSet<String>(assetsManifest.readLines('UTF-8'))
    def visUiEntries = fileTree(assetsRoot).matching {
      include 'com/kotcrab/vis/ui/skin/**'
    }.files.collect { file ->
      file.absolutePath.substring(assetsRoot.absolutePath.length() + 1).replace('\\', '/')
    }.sort()

    boolean updated = false
    visUiEntries.each { entry ->
      if (!existingEntries.contains(entry)) {
        existingEntries.add(entry)
        updated = true
      }
    }
    if (updated) {
      assetsManifest.text = existingEntries.join('\n') + '\n'
    }
  }
}

tasks.register('buildWebRuntime', JavaExec) {
  group = 'distribution'
  description = 'Compiles the real TeaVM/WebGL runtime.'
  dependsOn(tasks.named('classes'))
  mainClass.set('com.github.alfu32.sketch.web.BuildWebApp')
  classpath = sourceSets.main.runtimeClasspath
  systemProperty('octodraw.web.output', webDistRoot.absolutePath)
  systemProperty('octodraw.web.folder', 'webapp')
  systemProperty('octodraw.web.assets', '../assets')
  systemProperty('octodraw.web.title', "Octodraw ${bundleVersion}")
  systemProperty('octodraw.web.serve', 'false')
}

tasks.named('buildWebRuntime') {
  finalizedBy(tasks.named('copyWebRuntimeClasspathResources'))
}

tasks.register('prepareWebDocs') {
  group = 'distribution'
  description = 'Copies docs into the TeaVM web runtime bundle.'
  dependsOn(tasks.named('buildWebRuntime'))

  inputs.dir(rootProject.file('docs'))
  inputs.file(rootProject.file('README.md'))
  inputs.file(rootProject.file('assets/appicon.png'))
  outputs.dir(webRuntimeDir)

  doLast {
    copy {
      from(rootProject.file('docs'))
      into(new File(webRuntimeDir, 'docs'))
      include('**/*.md')
      include('**/*.txt')
      exclude('downloads/**')
      exclude('tutorial/**')
      exclude('automation/**')
    }
    copy {
      from(rootProject.file('README.md'))
      into(webRuntimeDir)
    }
    copy {
      from(rootProject.file('assets/appicon.png'))
      into(new File(webRuntimeDir, 'assets'))
    }
  }
}

tasks.register('bundleWebZip', Zip) {
  group = 'distribution'
  description = 'Builds the TeaVM/WebGL runtime bundle (with docs) zip in dist/.'
  dependsOn(tasks.named('prepareWebDocs'))
  from(webRuntimeDir)
  destinationDirectory = rootProject.file('dist')
  archiveFileName = "octodraw-${bundleVersion}-webapp.zip"
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('bundleWeb') {
  group = 'distribution'
  description = 'Builds the single Octodraw webapp+docs zip artifact.'
  dependsOn(tasks.named('bundleWebZip'))
}
