def resolveGitTag = {
  try {
    def process = new ProcessBuilder("git", "describe", "--tags", "--abbrev=0")
      .directory(rootDir)
      .redirectErrorStream(true)
      .start()
    def output = process.inputStream.text.trim()
    def code = process.waitFor()
    if (code != 0) {
      return null
    }
    return output ? output : null
  } catch (Exception ignored) {
    return null
  }
}

def bundleVersion = (project.findProperty("releaseNumber") ?: resolveGitTag() ?: projectVersion).toString()
ext.bundleVersion = bundleVersion
ext.projectVersion = bundleVersion

allprojects {
  version = bundleVersion
  ext.projectVersion = bundleVersion
}

buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"

  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects.findAll { !['android', 'web'].contains(it.name) }) {
  apply plugin: 'java-library'
  apply plugin: 'kotlin'
  java.sourceCompatibility = 21

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    File assetsFolder = new File("${project.rootDir}/assets/")
    File assetsFile = new File(assetsFolder, "assets.txt")
    inputs.dir(assetsFolder)
    outputs.file(assetsFile)

    doLast {
      def entries = fileTree(assetsFolder) {
        exclude "assets.txt"
      }.files.collect { file ->
        assetsFolder.toPath().relativize(file.toPath()).toString().replace('\\', '/')
      }.sort()

      assetsFile.text = entries.isEmpty() ? "" : entries.join("\n") + "\n"
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
  compileKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
  compileTestKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

}

subprojects {
  version = bundleVersion
  ext.appName = 'octodraw'
  repositories {
    google()
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'octodraw' + '-parent'
