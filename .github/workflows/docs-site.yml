name: Docs Site

on:
  push:
    branches:
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build Octodraw webcomponent
        run: ./gradlew :web:prepareWebComponentBundle

      - name: Copy webcomponent bundle
        run: |
          rm -rf docs-site/static/webcomponent/*
          cp -R web/build/dist/webcomponent/. docs-site/static/webcomponent/

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Validate tutorial JSON
        working-directory: docs-site
        run: npm run validate:tutorials

      - name: Check docs site
        working-directory: docs-site
        run: npm run check

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
