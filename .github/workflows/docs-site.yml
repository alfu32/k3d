name: Docs Site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example 5.2.4 or v5.2.4"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Resolve release number
        id: release
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ github.event.inputs.tag }}"
          release_number="${release_tag#v}"

          if [[ -z "${release_number}" ]]; then
            echo "Release tag input is empty"
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_number=${release_number}" >> "$GITHUB_OUTPUT"

          echo "Release tag: ${release_tag}"
          echo "Release number: ${release_number}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Octodraw webcomponent
        run: ./gradlew :web:clean :web:prepareWebComponentBundle -PreleaseNumber=${{ steps.release.outputs.release_number }} --rerun-tasks --stacktrace --info

      - name: Inspect web build outputs
        if: always()
        run: |
          echo "web/build/dist:"
          find web/build/dist -maxdepth 6 -type f -print | sort || true

      - name: Upload web build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-diagnostics
          path: |
            web/build/dist/**
            web/build/tmp/**
            web/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify webcomponent bundle
        run: |
          test -f web/build/dist/webcomponent/octodraw-element.js
          test -f web/build/dist/webcomponent/octodraw-runtime.js
          test -d web/build/dist/webcomponent/scripts
          test -f web/build/dist/webcomponent/assets/assets.txt

      - name: Copy webcomponent bundle
        working-directory: docs-site
        run: npm run sync:webcomponent

      - name: Validate tutorial JSON
        working-directory: docs-site
        run: npm run validate:tutorials

      - name: Check docs site
        working-directory: docs-site
        run: npm run check

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
