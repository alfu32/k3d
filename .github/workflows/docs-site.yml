name: Docs Site

on:
  push:
    branches:
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Octodraw webcomponent
        run: ./gradlew :web:clean :web:prepareWebComponentBundle --rerun-tasks --stacktrace --info

      - name: Inspect web build outputs
        if: always()
        run: |
          echo "Repository root:"
          pwd

          echo ""
          echo "web/build/dist:"
          find web/build/dist -maxdepth 4 -type f -print | sort || true

          echo ""
          echo "web/build/dist/webcomponent:"
          find web/build/dist/webcomponent -maxdepth 4 -type f -print | sort || true

          echo ""
          echo "dist:"
          find dist -maxdepth 3 -type f -print | sort || true

      - name: Upload web build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-diagnostics
          path: |
            web/build/dist/**
            web/build/reports/**
            web/build/tmp/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify webcomponent bundle
        run: |
          test -d web/build/dist/webcomponent

          test -f web/build/dist/webcomponent/octodraw-element.js
          test -f web/build/dist/webcomponent/octodraw-runtime.js
          test -f web/build/dist/webcomponent/assets/assets.txt

          if [ ! -f web/build/dist/webcomponent/scripts/gdx.wasm.js ]; then
            echo "Missing scripts/gdx.wasm.js"
            echo "Available files under scripts:"
            find web/build/dist/webcomponent/scripts -maxdepth 3 -type f -print || true
            exit 1
          fi

      - name: Copy webcomponent bundle
        working-directory: docs-site
        run: npm run sync:webcomponent

      - name: Validate tutorial JSON
        working-directory: docs-site
        run: npm run validate:tutorials

      - name: Check docs site
        working-directory: docs-site
        run: npm run check

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
