name: Docs Site

on:
  push:
    branches:
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Print CI environment
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Working directory:"
          pwd

      - name: Build Octodraw webcomponent
        run: ./gradlew :web:clean :web:prepareWebComponentBundle --rerun-tasks --stacktrace --info

      - name: Inspect web build outputs
        if: always()
        run: |
          echo "web/build/dist:"
          find web/build/dist -maxdepth 6 -type f -print | sort || true

          echo ""
          echo "web/build/tmp:"
          find web/build/tmp -maxdepth 6 -type f -print | sort || true

          echo ""
          echo "web/build/reports:"
          find web/build/reports -maxdepth 6 -type f -print | sort || true

      - name: Upload web build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-diagnostics
          path: |
            web/build/dist/**
            web/build/tmp/**
            web/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Verify webcomponent bundle
        run: |
          test -f web/build/dist/webcomponent/octodraw-element.js
          test -f web/build/dist/webcomponent/octodraw-runtime.js
          test -d web/build/dist/webcomponent/scripts
          test -f web/build/dist/webcomponent/assets/assets.txt

      - name: Copy webcomponent bundle
        working-directory: docs-site
        run: npm run sync:webcomponent

      - name: Validate tutorial JSON
        working-directory: docs-site
        run: npm run validate:tutorials

      - name: Check docs site
        working-directory: docs-site
        run: npm run check

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
