name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 2.0.0)"
        required: true
      draft:
        description: "Create release as draft"
        required: false
        default: "true"
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: "false"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build Linux bundle
        run: ./gradlew :lwjgl3:bundleLinux -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-linux
          path: dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build Windows bundle
        run: .\\gradlew.bat :lwjgl3:bundleWin -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-windows
          path: dist/*.zip

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build macOS bundle (arm64)
        run: ./gradlew :lwjgl3:bundleMacArm64 -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-mac
          path: dist/*.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-mac]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
