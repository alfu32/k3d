name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 2.0.0)"
        required: true
      draft:
        description: "Create release as draft"
        required: false
        default: "true"
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build Linux bundle
        run: ./gradlew :lwjgl3:bundleLinux -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-linux
          path: dist/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build Windows bundle
        run: .\\gradlew.bat :lwjgl3:bundleWin -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-windows
          path: dist/*.zip

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build macOS bundle (arm64)
        run: ./gradlew :lwjgl3:bundleMacArm64 -PreleaseNumber="${{ inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: k3d-mac
          path: dist/*.zip

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-mac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft="$DRAFT" --prerelease="$PRERELEASE"
          else
            gh release edit "$TAG" --draft="$DRAFT" --prerelease="$PRERELEASE"
          fi
          files=$(find artifacts -type f -name "*.zip")
          if [ -z "$files" ]; then
            echo "No zip artifacts found."
            exit 1
          fi
          gh release upload "$TAG" $files --clobber
