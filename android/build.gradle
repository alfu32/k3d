apply plugin: 'com.android.application'

configurations {
  natives
}

def releaseVersionName = (project.findProperty("releaseNumber")
  ?: rootProject.ext.projectVersion
  ?: "0.0.0").toString()

def releaseVersionCode = ((project.findProperty("androidVersionCode")
  ?: System.getenv("ANDROID_VERSION_CODE")
  ?: "1").toString()).toInteger()

def releaseStoreFile = (project.findProperty("ANDROID_UPLOAD_STORE_FILE")
  ?: System.getenv("ANDROID_UPLOAD_STORE_FILE"))?.toString()
def releaseStorePassword = (project.findProperty("ANDROID_UPLOAD_STORE_PASSWORD")
  ?: System.getenv("ANDROID_UPLOAD_STORE_PASSWORD"))?.toString()
def releaseKeyAlias = (project.findProperty("ANDROID_UPLOAD_KEY_ALIAS")
  ?: System.getenv("ANDROID_UPLOAD_KEY_ALIAS"))?.toString()
def releaseKeyPassword = (project.findProperty("ANDROID_UPLOAD_KEY_PASSWORD")
  ?: System.getenv("ANDROID_UPLOAD_KEY_PASSWORD"))?.toString()
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
  namespace = "com.github.alfu32.sketch.android"
  compileSdk = 36

  defaultConfig {
    applicationId "com.github.alfu32.sketch"
    minSdk = 26
    targetSdk = 35
    versionCode releaseVersionCode
    versionName releaseVersionName
    multiDexEnabled true
  }

  signingConfigs {
    release {
      if (hasReleaseSigning) {
        storeFile file(releaseStoreFile)
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      minifyEnabled false
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      }
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      manifest.srcFile "src/main/AndroidManifest.xml"
      java.srcDirs = ["src/main/kotlin"]
      assets.srcDirs = [rootProject.file("assets").path]
      res.srcDirs = ["src/main/res"]
      jniLibs.srcDirs = ["${buildDir}/androidNatives"]
    }
  }

  packaging {
    resources {
      excludes += [
        'META-INF/INDEX.LIST',
        'META-INF/*.SF',
        'META-INF/*.DSA',
        'META-INF/*.RSA'
      ]
    }
  }
}

def registerRenamedApkTask = { String taskName, String assembleTask, String variantDir, String outputName ->
  tasks.register(taskName, Copy) {
    dependsOn assembleTask
    from(layout.buildDirectory.dir("outputs/apk/${variantDir}"))
    include("*-${variantDir}-*.apk", "*-${variantDir}.apk")
    rename { outputName }
    into(rootProject.layout.projectDirectory.dir("dist"))
  }
}

tasks.register("copyAndroidNatives") {
  doLast {
    def outDir = layout.buildDirectory.dir("androidNatives").get().asFile
    delete(outDir)
    outDir.mkdirs()
    configurations.natives.files.each { jarFile ->
      def name = jarFile.name
      def abi = (
        name.contains("natives-arm64-v8a") ? "arm64-v8a" :
        name.contains("natives-armeabi-v7a") ? "armeabi-v7a" :
        name.contains("natives-x86_64") ? "x86_64" :
        name.contains("natives-x86") ? "x86" :
        null
      )
      if (abi == null) {
        return
      }
      copy {
        from zipTree(jarFile)
        include "**/*.so"
        into new File(outDir, abi)
        includeEmptyDirs = false
        eachFile { details ->
          details.path = details.name
        }
      }
    }
  }
}

tasks.matching { it.name == "preBuild" }.configureEach {
  dependsOn "copyAndroidNatives"
}

tasks.matching { task ->
  task.name.startsWith("merge") && task.name.endsWith("Assets")
}.configureEach {
  dependsOn rootProject.tasks.named("generateAssetList")
}

registerRenamedApkTask(
  "bundleAndroidApk",
  "assembleRelease",
  "release",
  "octodraw-${releaseVersionName}.apk"
)

registerRenamedApkTask(
  "bundleAndroidDebugApk",
  "assembleDebug",
  "debug",
  "octodraw-${releaseVersionName}-debug.apk"
)

tasks.register("bundleAndroidLocalTestApk") {
  group = "distribution"
  description = "Builds a locally signed debug APK for device testing and copies it to dist/."
  dependsOn "bundleAndroidDebugApk"
}

tasks.register("bundleAndroidAab", Copy) {
  dependsOn "bundleRelease"
  from(layout.buildDirectory.dir("outputs/bundle/release"))
  include("*.aab")
  rename { "octodraw-${releaseVersionName}.aab" }
  into(rootProject.layout.projectDirectory.dir("dist"))
}

gradle.taskGraph.whenReady { graph ->
  def needsReleaseSigning = graph.hasTask(":android:bundleRelease") ||
    graph.hasTask(":android:assembleRelease") ||
    graph.hasTask(":android:bundleAndroidApk") ||
    graph.hasTask(":android:bundleAndroidAab")
  if (needsReleaseSigning && !hasReleaseSigning) {
    throw new GradleException(
      "Release signing is not configured. Set ANDROID_UPLOAD_STORE_FILE, " +
        "ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD " +
        "in ~/.gradle/gradle.properties or environment variables."
    )
  }
}

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
}
